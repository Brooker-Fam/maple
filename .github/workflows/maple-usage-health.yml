name: Maple usage health

on:
  schedule:
    - cron: "45 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Check daily usage job
        env:
          MAPLE_USAGE_MONITOR_SECRET: ${{ secrets.MAPLE_USAGE_MONITOR_SECRET }}
          MAPLE_USAGE_MONITOR_RESEND_KEY: ${{ secrets.MAPLE_USAGE_MONITOR_RESEND_KEY }}
          MAPLE_ALERT_EMAIL: ${{ secrets.MAPLE_ALERT_EMAIL }}
        run: node scripts/usage-health-monitor.mjs
