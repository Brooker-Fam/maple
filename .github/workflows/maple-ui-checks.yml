name: Maple UI checks

on:
  push:
    branches: [main, codex/maple-time-editing]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint
      - name: Development content and saved milestones
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm check:maple-development && pnpm check:maple-tenancy log
      - name: Nursing checks
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm check:maple-feed
      - name: Pattern clock and data checks
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm check:maple-patterns
      - name: Feed status and sync diagnostics
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm check:maple-feed-status && pnpm check:maple-diagnostics
      - name: Medicine checks
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm check:maple-care
      - name: Epic import authorization, parsing and isolation
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm check:maple-epic
      - name: Maternal food and drink checks
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm check:maple-nutrition && pnpm check:maple-tenancy nutrition nutrition-tools
      - name: Time editing checks
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm check:maple-time-edit && pnpm check:maple-tenancy timer-time-correction
      - name: Admin access, drilldowns and waitlist email
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm check:maple-tenancy admin admin-details admin-email
      - name: Chat checks
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm check:maple-chat
      - name: Chat family boundaries and copy
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm check:maple-tenancy chat-charts chat-delivery chat-entry-status chat-search chat-settings copy
      - name: Install browser check tools
        id: browser_tools
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm install --prefix /tmp/maple-ui-tools --no-save esbuild@0.25.10 playwright@1.56.1 postcss@8.5.6
      - name: Install Chromium
        id: browser
        if: ${{ !cancelled() && steps.browser_tools.outcome == 'success' }}
        env:
          NODE_PATH: /tmp/maple-ui-tools/node_modules
        run: node /tmp/maple-ui-tools/node_modules/playwright/cli.js install --with-deps chromium
      - name: Check time editing in the browser
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        env:
          NODE_PATH: /tmp/maple-ui-tools/node_modules
        run: node scripts/ui-check/run.mjs
      - name: Check daily discoveries and milestones in the browser
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        env:
          NODE_PATH: /tmp/maple-ui-tools/node_modules
        run: pnpm check:maple-development-ui
      - name: Check chat in the browser
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        env:
          NODE_PATH: /tmp/maple-ui-tools/node_modules
        run: pnpm check:maple-chat-ui
      - name: Check save and refresh ordering in the browser
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: pnpm check:maple-sync
      - name: Check medical record import in the browser
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        env:
          NODE_PATH: /tmp/maple-ui-tools/node_modules
        run: pnpm check:maple-epic-ui
      - name: Check maternal food and drinks in the browser
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        env:
          NODE_PATH: /tmp/maple-ui-tools/node_modules
        run: pnpm check:maple-nutrition-ui && pnpm check:maple-nutrition-chat-ui
      - name: Check pattern views in the browser
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        env:
          NODE_PATH: /tmp/maple-ui-tools/node_modules
        run: pnpm check:maple-patterns-ui
      - name: Check admin in the browser
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        env:
          NODE_PATH: /tmp/maple-ui-tools/node_modules
        run: node scripts/admin-ui-check/run.mjs
      - name: Check app flow regressions
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        env:
          NODE_PATH: /tmp/maple-ui-tools/node_modules
        run: pnpm check:maple-ui-review
      - name: Check account menu, settings and Siri setup
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: pnpm check:maple-settings-ui
      - name: Check failed saves and family changes
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        env:
          NODE_PATH: /tmp/maple-ui-tools/node_modules
        run: pnpm check:maple-ui-recovery
      - name: Save synthetic UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maple-ui-screenshots
          path: |
            test-results/maple-ui
            test-results/maple-development-ui
            test-results/maple-chat-ui
            test-results/maple-entrypoints-ui
            test-results/maple-nutrition-ui
            test-results/maple-nutrition-chat-ui
            test-results/maple-patterns-ui
            test-results/maple-admin-ui
            test-results/maple-search-ui
            test-results/maple-shared-ui
            test-results/maple-logging-ui
            test-results/maple-settings-ui
            test-results/settings-ui
            test-results/maple-moments-ui
            test-results/maple-care-ui
            test-results/maple-notification-recovery
            test-results/maple-onboarding-recovery
            test-results/maple-logging-recovery
            test-results/maple-care-recovery
          if-no-files-found: ignore
      - name: Build without database migrations
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec next build
