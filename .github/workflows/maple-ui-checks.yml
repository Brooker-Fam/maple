name: Maple UI checks

on:
  push:
    branches: [main, codex/maple-time-editing]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint
      - name: Nursing checks
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm check:maple-feed
      - name: Medicine checks
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm check:maple-care
      - name: Time editing checks
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm check:maple-time-edit
      - name: Admin metrics access and counts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm check:maple-tenancy admin
      - name: Install browser check tools
        id: browser_tools
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm install --prefix /tmp/maple-ui-tools --no-save esbuild@0.25.10 playwright@1.56.1 postcss@8.5.6
      - name: Install Chromium
        id: browser
        if: ${{ !cancelled() && steps.browser_tools.outcome == 'success' }}
        env:
          NODE_PATH: /tmp/maple-ui-tools/node_modules
        run: node /tmp/maple-ui-tools/node_modules/playwright/cli.js install --with-deps chromium
      - name: Check time editing in the browser
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        env:
          NODE_PATH: /tmp/maple-ui-tools/node_modules
        run: node scripts/ui-check/run.mjs
      - name: Save synthetic UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maple-ui-screenshots
          path: test-results/maple-ui
          if-no-files-found: ignore
      - name: Build without database migrations
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec next build
