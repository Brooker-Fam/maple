# Maple's Log notifications: a best-effort backstop for the tick (src/lib/maple/push.ts).
# The real clock is Upstash QStash (exact-time wake-ups plus a safety-net schedule, see
# docs/maple.md → Notifications); without QStash this and an open app's polls are all
# there is. GitHub runs scheduled jobs late or skips them under load (about 3 runs in
# 7 hours were seen overnight), so never rely on this alone for a dose that matters.
# Once QStash is set up, the tick ignores runs away from :04 and :34 (the safety net's
# minutes) without touching the database.
name: Maple reminders

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: curl -fsS -X POST --max-time 60 -H "X-Maple-Via: gh" https://brooker.family/api/maple/push/tick
